services:
  - type: web
    name: veritas-api
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: |
      pip install uv &&
      uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MEDIACLOUD_API_KEY
        sync: false
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
